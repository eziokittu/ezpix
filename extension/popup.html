<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EzPix capture</title><link rel="stylesheet" href="app.css"></head><body class="ez-app popup" data-theme="system"><header><strong>EzPix</strong><label>Appearance <select data-theme-picker><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label></header><h1>Capture inspiration.</h1><p>Select visible pixels from the current webpage. Images and elements use a screenshot; nothing is fetched from their original servers.</p><button data-mode="region" class="ez-primary">Select region</button><button data-mode="element">Select element or image</button><button data-mode="visible">Capture visible page</button><button data-resume>Open conversion workspace</button><p role="status">Esc cancels selection. Partly hidden elements capture only their visible area. Use content you have permission to reuse.</p><script type="module" src="popup.js"></script></body></html>
